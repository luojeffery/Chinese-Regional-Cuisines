<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>63 Cuisines of China — Interactive Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0e1015;
    --panel:#1b1e27;
    --panel2:#232733;
    --accent:#e0563a;
    --text:#eee7dd;
    --muted:#9aa0ad;
    --border:#333846;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none;}
  #stage.panning{cursor:grabbing;}

  #hoverLabel{
    position:fixed;pointer-events:none;z-index:50;
    background:rgba(20,20,24,.95);color:#fff;padding:5px 10px;border-radius:5px;
    font-size:13px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);
    display:none;box-shadow:0 4px 14px rgba(0,0,0,.4);
    white-space:nowrap;
  }

  #sidebar{
    position:fixed;top:0;right:0;bottom:0;width:420px;max-width:90vw;
    background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;overflow-x:hidden;
    transform:translateX(100%);transition:transform .28s ease;
    box-shadow:-12px 0 40px rgba(0,0,0,.5);
    z-index:20;
  }
  #sidebar.open{transform:translateX(0);}
  #sideHeader{
    position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--panel2),var(--panel2) 85%,transparent);
    padding:22px 24px 14px;border-bottom:1px solid var(--border);
  }
  #sideHeader h2{margin:0;font-size:22px;font-weight:700;color:#fff;}
  #closeBtn{
    position:absolute;top:18px;right:18px;background:none;border:none;color:var(--muted);
    font-size:20px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px;
  }
  #closeBtn:hover{color:#fff;background:rgba(255,255,255,.08);}

  #sideContent{padding:18px 24px;}
  .imageGallery{display:grid;grid-template-columns:1fr;gap:12px;margin:8px 0 18px;}
  .imageGallery.gallerySix,.imageGallery.galleryThree{grid-template-columns:repeat(3,minmax(0,1fr));}
  .imageGallery.galleryFour{grid-template-columns:repeat(2,minmax(0,1fr));}
  .galleryGroupTitle{font-size:13px;font-weight:700;color:#fff;margin:16px 0 8px;}
  .galleryGroupTitle:first-child{margin-top:6px;}
  .galleryItem{min-width:0;}
  .galleryImageButton{
    width:100%;padding:0;border:0;background:none;display:block;cursor:pointer;border-radius:6px;
  }
  .galleryImageButton:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .galleryImageButton img{
    width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block;margin:0;
    box-shadow:0 4px 16px rgba(0,0,0,.35);
  }
  .imgCaption{font-size:11.5px;color:var(--muted);margin:5px 0 0;line-height:1.35;font-style:italic;}
  .para{font-size:14.5px;line-height:1.65;color:#ddd6cb;margin:0 0 14px;}
  .empty{color:var(--muted);font-size:14px;font-style:italic;padding:40px 0;text-align:center;}

  #imageLightbox{
    position:fixed;inset:0;z-index:60;background:rgba(7,8,11,.86);
    display:none;align-items:center;justify-content:center;padding:28px;
  }
  #imageLightbox.open{display:flex;}
  #imageLightboxInner{max-width:min(1100px,96vw);max-height:94vh;display:grid;gap:10px;}
  #imageLightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px;box-shadow:0 12px 42px rgba(0,0,0,.55);}
  #imageLightboxCaption{margin:0;color:#eee7dd;font-size:13px;line-height:1.45;text-align:center;}
  #imageLightboxClose{
    position:fixed;top:16px;right:18px;width:36px;height:36px;border-radius:6px;
    border:1px solid var(--border);background:rgba(20,20,24,.88);color:#fff;
    font-size:22px;line-height:1;cursor:pointer;
  }
  #imageLightboxClose:hover{background:rgba(224,86,58,.85);}

  #labelLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3;}
  .mapLabel{
    position:absolute;top:0;left:0;
    transform:translate(-50%,-50%);
    background:#fff;color:#111;
    font-weight:700;font-size:11px;letter-spacing:.01em;
    padding:2px 5px;border-radius:2px;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  #zoomHint{
    position:fixed;bottom:14px;left:16px;z-index:5;font-size:11px;color:var(--muted);
    background:rgba(20,20,24,.7);padding:6px 10px;border-radius:5px;pointer-events:none;
    border:1px solid var(--border);
  }

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#3a3f4d;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #zoomControls{
    position:fixed;bottom:14px;right:14px;z-index:5;
    display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.4);
    border-radius:6px;overflow:hidden;border:1px solid var(--border);
  }
  #zoomControls button{
    width:36px;height:36px;background:rgba(20,20,24,.85);color:#fff;
    border:none;font-size:19px;font-weight:600;cursor:pointer;
    display:block;line-height:1;
  }
  #zoomControls button:first-child{border-bottom:1px solid var(--border);}
  #zoomControls button:hover{background:rgba(224,86,58,.85);}
  #resetViewBtn{
    position:fixed;bottom:14px;right:60px;z-index:5;
    background:rgba(20,20,24,.85);color:#fff;border:1px solid var(--border);
    border-radius:6px;padding:0 12px;height:36px;font-size:12px;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #resetViewBtn:hover{background:rgba(224,86,58,.85);}

  #editorToggle{
    display:none;
    position:fixed;top:14px;left:14px;z-index:12;
    height:36px;padding:0 12px;border-radius:6px;border:1px solid var(--border);
    background:rgba(20,20,24,.88);color:#fff;font-size:12px;font-weight:700;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
  }
  #editorToggle.active{background:rgba(224,86,58,.94);}
  #editorToggle:disabled{opacity:.45;cursor:not-allowed;background:rgba(20,20,24,.72);}
  #editorPanel{
    position:fixed;top:58px;left:14px;bottom:58px;width:330px;max-width:calc(100vw - 28px);
    z-index:11;background:rgba(27,30,39,.96);border:1px solid var(--border);
    border-radius:8px;box-shadow:0 12px 38px rgba(0,0,0,.45);
    display:none;overflow:hidden;
  }
  #editorPanel.open{display:flex;flex-direction:column;}
  #editorPanel.open.collapsed{display:none;}
  #editorHeader{padding:14px 14px 10px;border-bottom:1px solid var(--border);background:var(--panel2);}
  #editorHeaderTop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  #editorHeader h2{margin:0;font-size:15px;color:#fff;}
  #hideEditorPanelBtn{
    height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--border);
    background:rgba(255,255,255,.07);color:#ddd6cb;font-size:12px;font-weight:700;cursor:pointer;
  }
  #hideEditorPanelBtn:hover{background:rgba(224,86,58,.75);color:#fff;}
  #activeRegion{display:flex;align-items:center;gap:8px;font-size:12px;color:#ddd6cb;margin-bottom:10px;}
  #paintScope{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
  #paintScope button{
    height:30px;border-radius:6px;border:1px solid var(--border);
    background:rgba(255,255,255,.06);color:#ddd6cb;font-size:12px;font-weight:700;cursor:pointer;
  }
  #paintScope button.active{background:rgba(224,86,58,.94);border-color:rgba(255,255,255,.3);color:#fff;}
  .swatchChip{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.65);flex:none;}
  #regionSearch,#correctionsOutput{
    width:100%;background:#11141b;color:#fff;border:1px solid var(--border);border-radius:6px;
    font:12px "Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  #regionSearch{height:32px;padding:0 9px;}
  #regionList{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:5px;}
  .regionOption{
    width:100%;display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;
    background:rgba(255,255,255,.04);border:1px solid transparent;color:#eee7dd;
    border-radius:6px;padding:7px 8px;text-align:left;cursor:pointer;font-size:12px;
  }
  .regionOption:hover{background:rgba(255,255,255,.08);}
  .regionOption.active{border-color:var(--accent);background:rgba(224,86,58,.16);}
  .regionCount{color:var(--muted);font-size:11px;}
  #editorFooter{padding:10px 14px 14px;border-top:1px solid var(--border);display:grid;gap:8px;}
  #editStatus{font-size:12px;color:var(--muted);line-height:1.4;}
  .editorActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .editorActions button{
    height:32px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.07);
    color:#fff;font-size:12px;cursor:pointer;
  }
  .editorActions button:hover{background:rgba(224,86,58,.75);}
  #correctionsOutput{height:86px;padding:8px;resize:none;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labelLayer"></div>
<div id="hoverLabel"></div>
<div id="zoomHint">scroll to zoom &middot; drag to pan &middot; click a region for details</div>
<button id="resetViewBtn" title="Reset view">Reset view</button>
<div id="zoomControls">
  <button id="zoomInBtn" title="Zoom in">+</button>
  <button id="zoomOutBtn" title="Zoom out">&minus;</button>
</div>
<button id="editorToggle" title="Region editing disabled" disabled aria-hidden="true">Edit regions</button>
<div id="editorPanel" aria-label="Food region editor">
  <div id="editorHeader">
    <div id="editorHeaderTop">
      <h2>Paint Food Regions</h2>
      <button id="hideEditorPanelBtn" type="button" title="Hide painting tools">Hide</button>
    </div>
    <div id="activeRegion"><span class="swatchChip"></span><span>Select a region</span></div>
    <div id="paintScope" role="group" aria-label="Paint scope">
      <button class="active" type="button" data-paint-scope="county">County</button>
      <button type="button" data-paint-scope="prefecture">Prefecture</button>
    </div>
    <input id="regionSearch" type="search" placeholder="Search food regions" />
  </div>
  <div id="regionList"></div>
  <div id="editorFooter">
    <div id="editStatus">No county edits yet.</div>
    <textarea id="correctionsOutput" readonly spellcheck="false"></textarea>
    <div class="editorActions">
      <button id="copyCorrectionsBtn" type="button">Copy JSON</button>
      <button id="undoCorrectionBtn" type="button">Undo</button>
      <button id="clearCorrectionsBtn" type="button">Clear edits</button>
      <button id="refreshExportBtn" type="button">Refresh JSON</button>
    </div>
  </div>
</div>
<div id="sidebar">
  <div id="sidebarInner">
    <div class="empty" style="padding:60px 24px;">Click any region on the map to see its dishes, description, and Chinese name/terms.</div>
  </div>
</div>
<div id="imageLightbox" aria-hidden="true">
  <button id="imageLightboxClose" type="button" title="Close image">&times;</button>
  <div id="imageLightboxInner">
    <img id="imageLightboxImg" alt="" />
    <p id="imageLightboxCaption"></p>
  </div>
</div>

<script src="assets/editor_state.js?v=edit-regions-hidden"></script>
<script src="assets/input_events.js?v=edit-regions-hidden"></script>
<script src="assets/spatial_index.js?v=edit-regions-hidden"></script>
<script src="assets/map.js?v=edit-regions-hidden"></script>
<script type="text/plain" id="legacy-raster-script">
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hoverLabel = document.getElementById('hoverLabel');
const labelLayer = document.getElementById('labelLayer');
const sidebar = document.getElementById('sidebar');
const sidebarInner = document.getElementById('sidebarInner');
let labelEls = []; // [{el, x, y}] world-space anchor, screen pos applied every draw

const mapImg = new Image();
mapImg.src = 'assets/china_map.png';
const labelImg = new Image();
labelImg.src = 'assets/labels.png';

let DATA = null;         // { width, height, features:{id: {name,paragraphs,images,bbox}} }
let labelData = null;    // Uint8ClampedArray RGBA of label raster
let labelW = 0, labelH = 0;
let imgW = 0, imgH = 0;

let scale = 1, tx = 0, ty = 0;
let MIN_SCALE = 0.2;
const MAX_SCALE = 12;

let hoverId = 0, selectedId = 0;
const maskCache = new Map(); // id -> {canvas, x0, y0}

let dpr = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas(){
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  draw();
}

function computeFitTransform(){
  const sw = window.innerWidth, sh = window.innerHeight;
  // "contain" fit: the whole map is always visible, nothing cropped or cut
  // off at the edges. The ocean-blue background fills whatever margin is
  // left over on the shorter axis instead of leaving it blank/white.
  const s = Math.min(sw / imgW, sh / imgH);
  return { scale: s, tx: (sw - imgW*s) / 2, ty: (sh - imgH*s) / 2 };
}

function fitToScreen(){
  const t = computeFitTransform();
  scale = t.scale; tx = t.tx; ty = t.ty;
  MIN_SCALE = t.scale;
}

// --- smooth camera animation (used for click-to-frame-a-region, the zoom
// buttons, and reset-view) so this reads as a real interactive map panning
// around instead of instant scroll-jumps ---
let flyRaf = null;
function animateTo(targetScale, targetTx, targetTy, duration){
  if (flyRaf) cancelAnimationFrame(flyRaf);
  const startScale = scale, startTx = tx, startTy = ty, startTime = performance.now();
  function step(now){
    const t = Math.min(1, (now - startTime) / duration);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    scale = startScale + (targetScale - startScale) * eased;
    tx = startTx + (targetTx - startTx) * eased;
    ty = startTy + (targetTy - startTy) * eased;
    draw();
    flyRaf = t < 1 ? requestAnimationFrame(step) : null;
  }
  flyRaf = requestAnimationFrame(step);
}

function flyToFeature(feat){
  const [x0, y0, x1, y1] = feat.bbox;
  const bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
  const sidebarW = Math.min(420, window.innerWidth * 0.9);
  const availW = Math.max(200, window.innerWidth - sidebarW);
  const availH = window.innerHeight;
  const PAD = 0.7; // leave breathing room instead of edge-to-edge framing
  const fitScale = Math.min(availW / bw, availH / bh) * PAD;
  const targetScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, fitScale));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const targetTx = availW / 2 - cx * targetScale;
  const targetTy = availH / 2 - cy * targetScale;
  animateTo(targetScale, targetTx, targetTy, 600);
}

function zoomBy(factor){
  if (flyRaf) cancelAnimationFrame(flyRaf);
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const p = screenToImage(cx, cy);
  const targetScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  const targetTx = cx - p.x * targetScale;
  const targetTy = cy - p.y * targetScale;
  animateTo(targetScale, targetTx, targetTy, 260);
}

Promise.all([
  new Promise(res => mapImg.onload = res),
  new Promise(res => labelImg.onload = res),
  fetch('assets/map_data.json').then(r => r.json())
]).then(([_, __, data]) => {
  DATA = data;
  imgW = mapImg.naturalWidth;
  imgH = mapImg.naturalHeight;
  labelW = labelImg.naturalWidth;
  labelH = labelImg.naturalHeight;

  const off = document.createElement('canvas');
  off.width = labelW; off.height = labelH;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(labelImg, 0, 0);
  labelData = offCtx.getImageData(0, 0, labelW, labelH).data;

  labelEls = (DATA.labels || []).map(l => {
    const el = document.createElement('div');
    el.className = 'mapLabel';
    el.textContent = l.name.toUpperCase();
    labelLayer.appendChild(el);
    return { el, x: l.x, y: l.y };
  });

  fitToScreen();
  resizeCanvas();
});

window.addEventListener('resize', () => {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  resizeCanvas();
});

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#add8e6';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if (!mapImg.complete || imgW === 0) return;

  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, tx*dpr, ty*dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(mapImg, 0, 0, imgW, imgH);

  if (selectedId){
    drawGroupMask(selectedId, 'rgba(224,86,58,0.42)');
  }
  if (hoverId && hoverId !== selectedId){
    // don't re-highlight pieces already covered by the selected group
    const selGroup = selectedId && DATA.features[selectedId] ? DATA.features[selectedId].group : null;
    if (!selGroup || !selGroup.includes(String(hoverId))){
      drawGroupMask(hoverId, 'rgba(255,255,255,0.28)');
    }
  }

  updateLabelPositions();
}

function updateLabelPositions(){
  // labels are real DOM nodes with a fixed CSS font-size, so they stay the
  // same on-screen size at any zoom level instead of scaling with the map
  // image the way the old baked-in text labels did
  for (const l of labelEls){
    const sx = tx + l.x * scale;
    const sy = ty + l.y * scale;
    l.el.style.transform = `translate(${sx}px, ${sy}px) translate(-50%,-50%)`;
  }
}

function drawGroupMask(id, color){
  const feat = DATA.features[id];
  if (!feat) return;
  const members = feat.group && feat.group.length ? feat.group : [id];
  for (const memberId of members){
    const m = getMask(memberId, color);
    if (m) ctx.drawImage(m.canvas, m.x0, m.y0);
  }
}

function getMask(id, color){
  const numId = Number(id);
  const cacheKey = numId + '|' + color;
  if (maskCache.has(cacheKey)) return maskCache.get(cacheKey);
  const feat = DATA.features[id];
  if (!feat || !feat.bbox) return null;
  const [x0, y0, x1, y1] = feat.bbox;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const mc = document.createElement('canvas');
  mc.width = bw; mc.height = bh;
  const mctx = mc.getContext('2d');
  const imgData = mctx.createImageData(bw, bh);
  const rgb = color.match(/[\d.]+/g).map(Number);
  const alpha = Math.round(rgb[3] * 255);
  for (let row = 0; row < bh; row++){
    const ly = y0 + row;
    if (ly < 0 || ly >= labelH) continue;
    for (let col = 0; col < bw; col++){
      const lx = x0 + col;
      if (lx < 0 || lx >= labelW) continue;
      const lidx = (ly * labelW + lx) * 4;
      // alpha 255 = a genuine painted-color pixel (tint it); alpha 200 =
      // reclaimed label/border/text -- still fully clickable as part of the
      // region, but skipped here so printed labels stay legible instead of
      // turning into a solid highlighted block
      if (labelData[lidx] === numId && labelData[lidx + 3] === 255){
        const oidx = (row * bw + col) * 4;
        imgData.data[oidx] = rgb[0];
        imgData.data[oidx+1] = rgb[1];
        imgData.data[oidx+2] = rgb[2];
        imgData.data[oidx+3] = alpha;
      }
    }
  }
  mctx.putImageData(imgData, 0, 0);
  const result = { canvas: mc, x0, y0 };
  maskCache.set(cacheKey, result);
  return result;
}

function screenToImage(clientX, clientY){
  return { x: (clientX - tx) / scale, y: (clientY - ty) / scale };
}

function idAt(clientX, clientY){
  if (!labelData) return 0;
  const p = screenToImage(clientX, clientY);
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if (x < 0 || y < 0 || x >= labelW || y >= labelH) return 0;
  const idx = (y * labelW + x) * 4;
  return labelData[idx];
}

// --- wheel zoom (centered on cursor) ---
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (flyRaf) cancelAnimationFrame(flyRaf);
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  const p = screenToImage(e.clientX, e.clientY);
  scale = newScale;
  tx = e.clientX - p.x * scale;
  ty = e.clientY - p.y * scale;
  draw();
}, { passive: false });

canvas.addEventListener('dblclick', (e) => {
  const p = screenToImage(e.clientX, e.clientY);
  const targetScale = Math.min(MAX_SCALE, scale * 1.8);
  const targetTx = e.clientX - p.x * targetScale;
  const targetTy = e.clientY - p.y * targetScale;
  animateTo(targetScale, targetTx, targetTy, 320);
});

// --- drag to pan / click detection ---
let isDown = false, isDragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;

canvas.addEventListener('pointerdown', (e) => {
  if (flyRaf) cancelAnimationFrame(flyRaf);
  isDown = true; isDragging = false;
  lastX = e.clientX; lastY = e.clientY;
  downX = e.clientX; downY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (isDown){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (!isDragging && (Math.abs(e.clientX-downX) > 4 || Math.abs(e.clientY-downY) > 4)){
      isDragging = true;
      canvas.classList.add('panning');
      hoverLabel.style.display = 'none';
    }
    if (isDragging){
      tx += dx; ty += dy;
      lastX = e.clientX; lastY = e.clientY;
      draw();
      return;
    }
  }

  const id = idAt(e.clientX, e.clientY);
  if (id !== hoverId){
    hoverId = id;
    draw();
  }
  if (id && DATA.features[id]){
    hoverLabel.textContent = DATA.features[id].name;
    hoverLabel.style.display = 'block';
    hoverLabel.style.left = (e.clientX + 16) + 'px';
    hoverLabel.style.top = (e.clientY + 12) + 'px';
  } else {
    hoverLabel.style.display = 'none';
  }
});

canvas.addEventListener('pointerup', (e) => {
  canvas.classList.remove('panning');
  if (!isDragging){
    const id = idAt(e.clientX, e.clientY);
    if (id && DATA.features[id]) selectFeature(id);
  }
  isDown = false; isDragging = false;
});

canvas.addEventListener('pointerleave', () => {
  hoverLabel.style.display = 'none';
  if (hoverId){ hoverId = 0; draw(); }
});

function selectFeature(id){
  selectedId = id;
  draw();
  const feat = DATA.features[id];

  sidebar.classList.add('open');
  flyToFeature(feat);

  let html = '';
  html += `<div id="sideHeader"><h2>${escapeHtml(feat.name)}</h2>`;
  html += `<button id="closeBtn" title="Close">&times;</button></div>`;
  html += `<div id="sideContent">`;

  if (!feat.paragraphs.length && !feat.images.length){
    html += `<div class="empty">No detailed write-up for this subregion in the source article.</div>`;
  } else {
    feat.images.forEach(im => {
      html += `<img src="${im.src}" loading="lazy" alt="${escapeHtml(feat.name)}" />`;
      if (im.caption) html += `<p class="imgCaption">${escapeHtml(im.caption)}</p>`;
    });
    feat.paragraphs.forEach(p => {
      html += `<p class="para">${escapeHtml(p)}</p>`;
    });
  }
  html += `</div>`;

  sidebarInner.innerHTML = html;
  document.getElementById('closeBtn').addEventListener('click', closeSidebar);
}

function closeSidebar(){
  sidebar.classList.remove('open');
  selectedId = 0;
  draw();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('zoomInBtn').addEventListener('click', () => zoomBy(1.5));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomBy(1/1.5));
document.getElementById('resetViewBtn').addEventListener('click', () => {
  closeSidebar();
  const t = computeFitTransform();
  animateTo(t.scale, t.tx, t.ty, 500);
});
</script>
</body>
</html>
