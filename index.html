<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>63 Cuisines of China — Interactive Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0e1015;
    --panel:#1b1e27;
    --panel2:#232733;
    --accent:#e0563a;
    --text:#eee7dd;
    --muted:#9aa0ad;
    --border:#333846;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;}
  #stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab;touch-action:none;}
  #stage.panning{cursor:grabbing;}

  #hoverLabel{
    position:fixed;pointer-events:none;z-index:50;
    background:rgba(20,20,24,.95);color:#fff;padding:5px 10px;border-radius:5px;
    font-size:13px;font-weight:600;letter-spacing:.02em;border:1px solid var(--border);
    display:none;box-shadow:0 4px 14px rgba(0,0,0,.4);
    white-space:nowrap;
  }

  #sidebar{
    position:fixed;top:0;right:0;bottom:0;width:420px;max-width:90vw;
    background:var(--panel);border-left:1px solid var(--border);
    overflow-y:auto;overflow-x:hidden;
    transform:translateX(100%);transition:transform .28s ease;
    box-shadow:-12px 0 40px rgba(0,0,0,.5);
    z-index:20;
  }
  #sidebar.open{transform:translateX(0);}
  #sideHeader{
    position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--panel2),var(--panel2) 85%,transparent);
    padding:22px 24px 14px;border-bottom:1px solid var(--border);
  }
  #sideHeader h2{margin:0;font-size:22px;font-weight:700;color:#fff;}
  #closeBtn{
    position:absolute;top:18px;right:18px;background:none;border:none;color:var(--muted);
    font-size:20px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px;
  }
  #closeBtn:hover{color:#fff;background:rgba(255,255,255,.08);}

  #sideContent{padding:18px 24px;}
  #sideContent img{width:100%;border-radius:8px;display:block;margin:10px 0 4px;
    box-shadow:0 4px 16px rgba(0,0,0,.35);}
  .imgCaption{font-size:12px;color:var(--muted);margin:0 0 18px;line-height:1.4;font-style:italic;}
  .para{font-size:14.5px;line-height:1.65;color:#ddd6cb;margin:0 0 14px;}
  .empty{color:var(--muted);font-size:14px;font-style:italic;padding:40px 0;text-align:center;}

  #labelLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3;}
  .mapLabel{
    position:absolute;top:0;left:0;
    transform:translate(-50%,-50%);
    background:#fff;color:#111;
    font-weight:700;font-size:11px;letter-spacing:.01em;
    padding:2px 5px;border-radius:2px;white-space:nowrap;
    box-shadow:0 1px 3px rgba(0,0,0,.35);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  #zoomHint{
    position:fixed;bottom:14px;left:16px;z-index:5;font-size:11px;color:var(--muted);
    background:rgba(20,20,24,.7);padding:6px 10px;border-radius:5px;pointer-events:none;
    border:1px solid var(--border);
  }

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#3a3f4d;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="labelLayer"></div>
<div id="hoverLabel"></div>
<div id="zoomHint">scroll to zoom &middot; drag to pan &middot; click a region for details</div>
<div id="sidebar">
  <div id="sidebarInner">
    <div class="empty" style="padding:60px 24px;">Click any region on the map to see its dishes, description, and Chinese name/terms.</div>
  </div>
</div>

<script>
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const hoverLabel = document.getElementById('hoverLabel');
const labelLayer = document.getElementById('labelLayer');
const sidebar = document.getElementById('sidebar');
const sidebarInner = document.getElementById('sidebarInner');
let labelEls = []; // [{el, x, y}] world-space anchor, screen pos applied every draw

const mapImg = new Image();
mapImg.src = 'assets/china_map.png';
const labelImg = new Image();
labelImg.src = 'assets/labels.png';

let DATA = null;         // { width, height, features:{id: {name,paragraphs,images,bbox}} }
let labelData = null;    // Uint8ClampedArray RGBA of label raster
let labelW = 0, labelH = 0;
let imgW = 0, imgH = 0;

let scale = 1, tx = 0, ty = 0;
let MIN_SCALE = 0.2;
const MAX_SCALE = 12;

let hoverId = 0, selectedId = 0;
const maskCache = new Map(); // id -> {canvas, x0, y0}

let dpr = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas(){
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  draw();
}

function fitToScreen(){
  const sw = window.innerWidth, sh = window.innerHeight;
  // "contain" fit: the whole map is always visible, nothing cropped or cut
  // off at the edges. The ocean-blue background fills whatever margin is
  // left over on the shorter axis instead of leaving it blank/white.
  scale = Math.min(sw / imgW, sh / imgH);
  MIN_SCALE = scale;
  tx = (sw - imgW*scale) / 2;
  ty = (sh - imgH*scale) / 2;
}

Promise.all([
  new Promise(res => mapImg.onload = res),
  new Promise(res => labelImg.onload = res),
  fetch('assets/map_data.json').then(r => r.json())
]).then(([_, __, data]) => {
  DATA = data;
  imgW = mapImg.naturalWidth;
  imgH = mapImg.naturalHeight;
  labelW = labelImg.naturalWidth;
  labelH = labelImg.naturalHeight;

  const off = document.createElement('canvas');
  off.width = labelW; off.height = labelH;
  const offCtx = off.getContext('2d');
  offCtx.drawImage(labelImg, 0, 0);
  labelData = offCtx.getImageData(0, 0, labelW, labelH).data;

  labelEls = (DATA.labels || []).map(l => {
    const el = document.createElement('div');
    el.className = 'mapLabel';
    el.textContent = l.name.toUpperCase();
    labelLayer.appendChild(el);
    return { el, x: l.x, y: l.y };
  });

  fitToScreen();
  resizeCanvas();
});

window.addEventListener('resize', () => {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  resizeCanvas();
});

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#add8e6';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if (!mapImg.complete || imgW === 0) return;

  ctx.setTransform(scale*dpr, 0, 0, scale*dpr, tx*dpr, ty*dpr);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(mapImg, 0, 0, imgW, imgH);

  if (selectedId){
    drawGroupMask(selectedId, 'rgba(224,86,58,0.42)');
  }
  if (hoverId && hoverId !== selectedId){
    // don't re-highlight pieces already covered by the selected group
    const selGroup = selectedId && DATA.features[selectedId] ? DATA.features[selectedId].group : null;
    if (!selGroup || !selGroup.includes(String(hoverId))){
      drawGroupMask(hoverId, 'rgba(255,255,255,0.28)');
    }
  }

  updateLabelPositions();
}

function updateLabelPositions(){
  // labels are real DOM nodes with a fixed CSS font-size, so they stay the
  // same on-screen size at any zoom level instead of scaling with the map
  // image the way the old baked-in text labels did
  for (const l of labelEls){
    const sx = tx + l.x * scale;
    const sy = ty + l.y * scale;
    l.el.style.transform = `translate(${sx}px, ${sy}px) translate(-50%,-50%)`;
  }
}

function drawGroupMask(id, color){
  const feat = DATA.features[id];
  if (!feat) return;
  const members = feat.group && feat.group.length ? feat.group : [id];
  for (const memberId of members){
    const m = getMask(memberId, color);
    if (m) ctx.drawImage(m.canvas, m.x0, m.y0);
  }
}

function getMask(id, color){
  const numId = Number(id);
  const cacheKey = numId + '|' + color;
  if (maskCache.has(cacheKey)) return maskCache.get(cacheKey);
  const feat = DATA.features[id];
  if (!feat || !feat.bbox) return null;
  const [x0, y0, x1, y1] = feat.bbox;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const mc = document.createElement('canvas');
  mc.width = bw; mc.height = bh;
  const mctx = mc.getContext('2d');
  const imgData = mctx.createImageData(bw, bh);
  const rgb = color.match(/[\d.]+/g).map(Number);
  const alpha = Math.round(rgb[3] * 255);
  for (let row = 0; row < bh; row++){
    const ly = y0 + row;
    if (ly < 0 || ly >= labelH) continue;
    for (let col = 0; col < bw; col++){
      const lx = x0 + col;
      if (lx < 0 || lx >= labelW) continue;
      const lidx = (ly * labelW + lx) * 4;
      // alpha 255 = a genuine painted-color pixel (tint it); alpha 200 =
      // reclaimed label/border/text -- still fully clickable as part of the
      // region, but skipped here so printed labels stay legible instead of
      // turning into a solid highlighted block
      if (labelData[lidx] === numId && labelData[lidx + 3] === 255){
        const oidx = (row * bw + col) * 4;
        imgData.data[oidx] = rgb[0];
        imgData.data[oidx+1] = rgb[1];
        imgData.data[oidx+2] = rgb[2];
        imgData.data[oidx+3] = alpha;
      }
    }
  }
  mctx.putImageData(imgData, 0, 0);
  const result = { canvas: mc, x0, y0 };
  maskCache.set(cacheKey, result);
  return result;
}

function screenToImage(clientX, clientY){
  return { x: (clientX - tx) / scale, y: (clientY - ty) / scale };
}

function idAt(clientX, clientY){
  if (!labelData) return 0;
  const p = screenToImage(clientX, clientY);
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if (x < 0 || y < 0 || x >= labelW || y >= labelH) return 0;
  const idx = (y * labelW + x) * 4;
  return labelData[idx];
}

// --- wheel zoom (centered on cursor) ---
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  const p = screenToImage(e.clientX, e.clientY);
  scale = newScale;
  tx = e.clientX - p.x * scale;
  ty = e.clientY - p.y * scale;
  draw();
}, { passive: false });

// --- drag to pan / click detection ---
let isDown = false, isDragging = false, lastX = 0, lastY = 0, downX = 0, downY = 0;

canvas.addEventListener('pointerdown', (e) => {
  isDown = true; isDragging = false;
  lastX = e.clientX; lastY = e.clientY;
  downX = e.clientX; downY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointermove', (e) => {
  if (isDown){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (!isDragging && (Math.abs(e.clientX-downX) > 4 || Math.abs(e.clientY-downY) > 4)){
      isDragging = true;
      canvas.classList.add('panning');
      hoverLabel.style.display = 'none';
    }
    if (isDragging){
      tx += dx; ty += dy;
      lastX = e.clientX; lastY = e.clientY;
      draw();
      return;
    }
  }

  const id = idAt(e.clientX, e.clientY);
  if (id !== hoverId){
    hoverId = id;
    draw();
  }
  if (id && DATA.features[id]){
    hoverLabel.textContent = DATA.features[id].name;
    hoverLabel.style.display = 'block';
    hoverLabel.style.left = (e.clientX + 16) + 'px';
    hoverLabel.style.top = (e.clientY + 12) + 'px';
  } else {
    hoverLabel.style.display = 'none';
  }
});

canvas.addEventListener('pointerup', (e) => {
  canvas.classList.remove('panning');
  if (!isDragging){
    const id = idAt(e.clientX, e.clientY);
    if (id && DATA.features[id]) selectFeature(id);
  }
  isDown = false; isDragging = false;
});

canvas.addEventListener('pointerleave', () => {
  hoverLabel.style.display = 'none';
  if (hoverId){ hoverId = 0; draw(); }
});

function selectFeature(id){
  selectedId = id;
  draw();
  const feat = DATA.features[id];

  sidebar.classList.add('open');

  let html = '';
  html += `<div id="sideHeader"><h2>${escapeHtml(feat.name)}</h2>`;
  html += `<button id="closeBtn" title="Close">&times;</button></div>`;
  html += `<div id="sideContent">`;

  if (!feat.paragraphs.length && !feat.images.length){
    html += `<div class="empty">No detailed write-up for this subregion in the source article.</div>`;
  } else {
    feat.images.forEach(im => {
      html += `<img src="${im.src}" loading="lazy" alt="${escapeHtml(feat.name)}" />`;
      if (im.caption) html += `<p class="imgCaption">${escapeHtml(im.caption)}</p>`;
    });
    feat.paragraphs.forEach(p => {
      html += `<p class="para">${escapeHtml(p)}</p>`;
    });
  }
  html += `</div>`;

  sidebarInner.innerHTML = html;
  document.getElementById('closeBtn').addEventListener('click', closeSidebar);
}

function closeSidebar(){
  sidebar.classList.remove('open');
  selectedId = 0;
  draw();
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
